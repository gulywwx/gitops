name: CI/CD — pharma-ui

# Triggers on push to develop / release branches only.
# PRs → lint, test, security run but no Docker build.
# PROD promotion → promote-prod-pharma-ui.yml (workflow_dispatch)

on:
  push:
    branches: [develop, 'release/**']
    paths:
      - 'frontend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build'
        required: false
        default: 'develop'

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: pharma-ui
  GITOPS_REPO: ${{ vars.GITOPS_REPO }}

jobs:
  # ── 1. Lint ───────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: ./node_modules/.bin/eslint src/ --ext .js,.jsx

  # ── 2. Unit Tests with Coverage ──────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --ci
        env:
          CI: true

      # `path` is an action input, so `defaults.run` does not apply to it —
      # it stays relative to the workspace root.
      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: frontend/coverage/
          retention-days: 3

  # ── 3. Code Quality & Security (SonarCloud + npm audit) ──────────────────
  sonar:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v6
        with:
          name: coverage-report
          path: frontend/coverage/

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Confines the scan to frontend/; sonar.sources and the lcov path
          # below are resolved relative to this directory.
          projectBaseDir: frontend
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_FRONTEND }}
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.test.js,**/*.test.jsx
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      - name: npm audit (HIGH/CRITICAL — fail)
        run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true

  # ── 4. Build React App ───────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, sonar]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: build-artifact
          path: frontend/build/

  # ── 5. Docker Build, Trivy Scan & Push to ECR ────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v5

      - name: Set short image tag
        id: tag
        run: echo "image_tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/pharma-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.image_tag }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest frontend

      - name: Trivy — scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.image_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Push image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.image_tag }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  # ── 6. Deploy — DEV (direct push to gitops) ──────────────────────────────
  deploy-dev:
    name: Deploy — DEV
    needs: docker-build-push
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - name: Checkout GitOps repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: _gitops

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Update image — DEV
        env:
          IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
          ECR_REGISTRY: ${{ needs.docker-build-push.outputs.registry }}
        run: |
          set -euo pipefail
          ENV_DIR="_gitops/gitops/envs/dev"
          VALUES="${ENV_DIR}/values-pharma-ui.yaml"
          COMMON="${ENV_DIR}/values-common.yaml"

          if [[ -z "${ECR_REGISTRY}" ]]; then
            echo "::error::ECR registry is empty — the login-ecr step did not produce a registry."
            exit 1
          fi
          for f in "${VALUES}" "${COMMON}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Values file not found: $f"
              exit 1
            fi
          done

          # The account ID lives once per environment, in values-common.yaml.
          # Writing it from the ECR login keeps it pinned to the registry we just
          # pushed to. Every service pipeline writes the same value, so this is
          # idempotent and produces no diff after the first run.
          yq e ".global.imageRegistry = \"${ECR_REGISTRY}\"" -i "${COMMON}"

          # Service values carry only the bare repository name; the chart joins
          # them as {{ .Values.global.imageRegistry }}/{{ .Values.image.repository }}.
          yq e ".image.repository = \"${ECR_REPOSITORY}\" | .image.tag = \"${IMAGE_TAG}\"" -i "${VALUES}"
          echo "Set image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          cd _gitops
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "Already up to date"
            exit 0
          fi
          git commit -m "ci(dev): update pharma-ui → ${IMAGE_TAG}"
          git push