name: CI/CD — manufacturing-service

# Triggers on push to develop / release branches only.
# Feature branches and PRs → ci-pr-manufacturing-service.yml
# PROD promotion → promote-prod.yml (workflow_dispatch)

on:
  push:
    branches: [develop, 'release/**']
    paths:
      - 'backend/manufacturing-service/**'
      - '.github/workflows/ci-manufacturing-service.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build'
        required: false
        default: 'develop'

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: manufacturing-service
  GITOPS_REPO: ${{ vars.GITOPS_REPO }}

jobs:

  build:
    name: "Build & Security Gates (manufacturing-service)"
    uses: ./.github/workflows/_java-build.yml
    with:
      service-name: manufacturing-service
      service-dir: backend/manufacturing-service
      ecr-repository: manufacturing-service
      aws-region: us-east-1
      needs-database: true
    secrets: inherit

  deploy-dev:
    name: "🚀 Deploy manufacturing-service → DEV"
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - name: Checkout GitOps repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: _gitops

      - name: Update image tag — DEV
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          yq e ".image.tag = \"${IMAGE_TAG}\"" -i \
            "_gitops/gitops/envs/dev/values-manufacturing-service.yaml"

          # Refresh the registry too: any pipeline can be the first to touch
          # dev, so none of them may assume another already wrote it.
          if [[ -z "${AWS_ACCOUNT_ID}" ]]; then
            echo "::error::AWS_ACCOUNT_ID secret is not set - cannot write global.imageRegistry"
            exit 1
          fi
          yq e ".global.imageRegistry = \"${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com\"" \
            -i "_gitops/gitops/envs/dev/values-common.yaml"

          cd _gitops
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet && echo "Already up to date" && exit 0
          git commit -m "ci(dev): update manufacturing-service → ${IMAGE_TAG}"
          pushed=false
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push; then pushed=true; break; fi
            echo "Push attempt ${attempt} lost the ref race - rebasing and retrying..."
            git pull --rebase origin main
            sleep $(( attempt + (RANDOM % 5) ))
          done
          if [ "${pushed}" != "true" ]; then
            echo "::error::Could not push the image tag after 8 attempts."
            exit 1
          fi
