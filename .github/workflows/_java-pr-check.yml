# Reusable — Lightweight Java PR / Feature Branch Check
#
# Used by ci-pr-<service>.yml workflows on feat-*, fix-*, chore-* branches and PRs.
# Intentionally stops before Docker — no image build, no ECR push, no Cosign.
# Goal: fast feedback (~5 min) for developers without burning ECR storage or runner time.
#
# Stages:
#   1. Maven verify  — unit/integration tests + JaCoCo coverage
#   2. SonarCloud    — SAST + code quality + coverage analysis
#   3. OWASP Dep Chk — CVSS ≥ 7.0 reported (non-blocking; add NVD_API_KEY for faster NVD sync)

name: Reusable — Java PR Check (no Docker)

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      service-dir:
        required: true
        type: string
      needs-database:
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: false
      NVD_API_KEY:
        description: "NIST NVD API key — higher rate limits + faster OWASP NVD updates"
        required: false

jobs:
  pr-check:
    name: PR Check (${{ inputs.service-name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      # Must be job-level: `secrets` is unavailable in a step `if`, `env` is.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Start PostgreSQL (integration tests)
        if: ${{ inputs.needs-database }}
        env:
          # ECR Public mirrors the Docker Official Images and imposes no anonymous
          # pull rate limit, unlike registry-1.docker.io.
          POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:15-alpine
        run: |
          set -euo pipefail

          pulled=""
          for attempt in 1 2 3; do
            if docker pull "$POSTGRES_IMAGE"; then pulled=yes; break; fi
            echo "::warning::Pull attempt ${attempt} failed; retrying"
            sleep $((attempt * 10))
          done
          if [ -z "$pulled" ]; then
            echo "::error::Could not pull ${POSTGRES_IMAGE} after 3 attempts"
            exit 1
          fi

          docker rm -f testdb >/dev/null 2>&1 || true
          docker run -d \
            --name testdb \
            -e POSTGRES_DB=testdb \
            -e POSTGRES_USER=testuser \
            -e POSTGRES_PASSWORD=testpass \
            -p 5432:5432 \
            "$POSTGRES_IMAGE"

          ready=""
          for _ in $(seq 60); do
            if docker exec testdb pg_isready -U testuser >/dev/null 2>&1; then ready=yes; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "::error::PostgreSQL did not become ready within 120s"
            docker logs testdb || true
            exit 1
          fi
          echo "PostgreSQL is ready."


      - name: Maven verify (tests + JaCoCo coverage)
        run: cd ${{ inputs.service-dir }} && mvn verify --no-transfer-progress
        env:
          SPRING_DATASOURCE_URL:      ${{ inputs.needs-database && 'jdbc:postgresql://localhost:5432/testdb' || '' }}
          SPRING_DATASOURCE_USERNAME: ${{ inputs.needs-database && 'testuser' || '' }}
          SPRING_DATASOURCE_PASSWORD: ${{ inputs.needs-database && 'testpass' || '' }}

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ inputs.service-name }}
          path: ${{ inputs.service-dir }}/target/site/jacoco/
          retention-days: 3

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != '' && vars.SONAR_ORG != '' && vars.SONAR_PROJECT_KEY != ''
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          projectBaseDir: ${{ inputs.service-dir }}
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.java.binaries=target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: "SonarCloud skipped (not configured)"
        if: env.SONAR_TOKEN == '' || vars.SONAR_ORG == '' || vars.SONAR_PROJECT_KEY == ''
        run: echo "::warning::SonarCloud scan skipped — set the SONAR_TOKEN secret plus the SONAR_ORG and SONAR_PROJECT_KEY variables to enable it."



      # ── OWASP Dependency Check ────────────────────────────────────────────────
      # Optional repo secret NVD_API_KEY — higher NVD rate limits; see CI-ARCHITECTURE.md
      - name: Cache OWASP NVD database
        if: false 
        uses: actions/cache@v4
        with:
          path: ~/.owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles(format('{0}/pom.xml', inputs.service-dir)) }}
          restore-keys: owasp-nvd-${{ runner.os }}-

      - name: OWASP Dependency Check (CVSS ≥ 7.0 — advisory; non-blocking)
        if: false
        continue-on-error: true
        run: |
          cd ${{ inputs.service-dir }}
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DenableRetired=true \
            #    -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
            #    -DnvdApiDelay=1000 \
            -DdataDirectory=$HOME/.owasp/dependency-check-data \
            -Dformat=HTML \
            --no-transfer-progress

      - name: Upload Dependency Check report
        if: false
     #   if: always()
        uses: actions/upload-artifact@v6
        with:
          name: depcheck-${{ inputs.service-name }}
          path: ${{ inputs.service-dir }}/target/dependency-check-report.html
          retention-days: 3
