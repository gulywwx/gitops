name: CI/CD — drug-catalog-service

# Triggers on push to develop / release branches only.
# Feature branches and PRs → ci-pr-drug-catalog.yml
# PROD promotion → promote-prod.yml (workflow_dispatch)
# Note: gitops uses "catalog-service" as the values file name for this service.

on:
  push:
    branches: [develop, 'release/**']
    paths:
      - 'backend/drug-catalog-service/**'
      - '.github/workflows/ci-drug-catalog.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build'
        required: false
        default: 'develop'

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: drug-catalog-service
  GITOPS_REPO: ${{ vars.GITOPS_REPO }}
  GITOPS_SERVICE_NAME: catalog-service

jobs:

  build:
    name: "Build & Security Gates (drug-catalog)"
    uses: ./.github/workflows/_java-build.yml
    with:
      service-name: drug-catalog-service
      service-dir: backend/drug-catalog-service
      ecr-repository: drug-catalog-service
      aws-region: us-east-1
      needs-database: true
    secrets: inherit

  deploy-dev:
    name: "🚀 Deploy drug-catalog → DEV"
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - name: Checkout GitOps repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: _gitops

      - name: Install yq
        run: |
          YQ_VERSION=v4.53.6
          wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x /usr/local/bin/yq
          yq --version

      - name: Update image tag — DEV
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          SVC: ${{ env.GITOPS_SERVICE_NAME }}
        run: |
          yq e ".image.tag = \"${IMAGE_TAG}\"" -i \
            "_gitops/gitops/envs/dev/values-${SVC}.yaml"

          # Refresh the registry too: any pipeline can be the first to touch
          # dev, so none of them may assume another already wrote it.
          if [[ -z "${AWS_ACCOUNT_ID}" ]]; then
            echo "::error::AWS_ACCOUNT_ID secret is not set - cannot write global.imageRegistry"
            exit 1
          fi
          yq e ".global.imageRegistry = \"${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com\"" \
            -i "_gitops/gitops/envs/dev/values-common.yaml"

          cd _gitops
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet && echo "Already up to date" && exit 0
          git commit -m "ci(dev): update ${SVC} → ${IMAGE_TAG}"
          pushed=false
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push; then pushed=true; break; fi
            echo "Push attempt ${attempt} lost the ref race - rebasing and retrying..."
            git pull --rebase origin main
            sleep $(( attempt + (RANDOM % 5) ))
          done
          if [ "${pushed}" != "true" ]; then
            echo "::error::Could not push the image tag after 8 attempts."
            exit 1
          fi
