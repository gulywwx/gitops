# ${BASE_DOMAIN} is substituted by 01_install_prerequisites.py from the
# terraform output "internal_domain".
#
# One Gateway serves every namespace because the AWS controller maps Gateways to
# ALBs 1:1 - there is no Gateway API equivalent of the Ingress group.name
# annotation that used to merge pharma-ui and api-gateway onto a single ALB.
# A Gateway per namespace would mean four ALBs, four addresses, and four
# /etc/hosts entries to keep current.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pharma-gateway
  namespace: gateway-system
spec:
  gatewayClassName: pharma-alb

  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: pharma-lbconfig

  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.${BASE_DOMAIN}"
      allowedRoutes:
        # Namespaces are not selected by label because ArgoCD creates them
        # itself via syncOptions CreateNamespace=true, which copies no labels -
        # a selector would silently drop routes from any namespace ArgoCD
        # created before 00_deploy.sh got to it. The listener hostname already
        # confines attachment to *.${BASE_DOMAIN} on this single-tenant cluster.
        namespaces:
          from: All

    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.${BASE_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
---
# The ALB answers on :80 only to bounce callers to :443. Both scheme and port
# change, which is what keeps this from becoming a redirect loop back onto the
# same listener. Ingress did this with the ssl-redirect annotation; Gateway API
# has no annotations, so the redirect is an ordinary route rule.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: gateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: pharma-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
