# ${BASE_DOMAIN} is substituted by 01_install_prerequisites.py.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    managed-by: terraform
spec:
  hostnames:
    - "argocd.${BASE_DOMAIN}"
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: pharma-gateway
      namespace: gateway-system
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 443
---
# argocd-server serves TLS on 443 with its own self-signed certificate, so the
# ALB has to speak HTTPS to it. This replaces the backend-protocol annotation
# the Ingress carried; the cluster-wide default target group config only sets
# targetType and would otherwise leave the ALB talking plaintext to a TLS port.
# The ALB does not verify backend certificates, so argocd's self-signed one is
# not a problem.
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: argocd-server
  namespace: argocd
spec:
  targetReference:
    kind: Service
    name: argocd-server
  defaultConfiguration:
    targetType: ip
    protocol: HTTPS
